<style>

#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}

#cover{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;padding:20px;transform:translateY(calc(var(--p,0)*-105%));opacity:calc(1 - var(--p,0)*1.3)}

.t1{font-size:clamp(40px,11vw,112px);line-height:.92;color:#f3d6d2;text-shadow:0 clamp(4px,.8vw,8px) 0 #04060d,0 0 46px rgba(216,52,63,.4);animation:slam .9s .3s cubic-bezier(.2,1.4,.4,1) both}

#login{align-items:center;justify-content:center;opacity:var(--lo,1)}

#warp{position:fixed;inset:0;z-index:80;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .5s;background:radial-gradient(circle,rgba(5,8,19,.15) 0%,rgba(5,8,19,.8) 80%)}

.mem:hover .x,.mem:focus-within .x{opacity:1}
#em{position:fixed;inset:0;z-index:90;display:none;place-items:center;text-align:center;padding:20px;cursor:pointer;background:rgba(104,18,30,.92)}
#em.on{display:grid;animation:flash .5s steps(2) infinite}@keyframes flash{50%{background:rgba(150,28,40,.94)}}
#em::before,#em::after{content:"";position:absolute;left:0;right:0;height:40px;background:repeating-linear-gradient(-45deg,#d9c36a 0 22px,#14121a 22px 44px);opacity:.9}#em::before{top:0}#em::after{bottom:0}
#em .t{font:400 clamp(38px,11vw,120px)/1 'Titan One',sans-serif;text-shadow:0 6px 0 #3a0a10;animation:slam2 .55s cubic-bezier(.2,1.5,.4,1) both,shk .4s .55s 3}
#em p{margin-top:16px;font-size:20px}#emcm{width:80px;margin:0 auto 18px;animation:bob 1s infinite}

@media(max-width:860px){.frame .in{padding:38px 20px 32px}.top .btn{flex:1}.mini{width:100%}.floor{grid-template-columns:repeat(2,1fr);padding:14px;gap:12px}.mem .fl{width:68px}.tags li{padding:0 10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

/* Check existing session and auto-redirect to player.html */

  const existing = localStorage.getItem('nexus_player_session');
  if (existing) {
    const p = JSON.parse(existing);
    if (p?.teamId) {
      window.location.replace('player.html');

/* ===== cover: swipe up & scroll transition ===== */
const cover=$('#cover'),login=$('#login');let sy=null,prog=0,opened=false,moved=false;
function setP(p){prog=Math.max(0,Math.min(1,p));cover.style.setProperty('--p',prog);login.style.setProperty('--lo',prog);warpTo3(prog*.8)}
cover.onpointerdown=e=>{if(opened||e.target.closest('#hint'))return;sy=e.clientY;moved=false;cover.classList.remove('rel');cover.setPointerCapture(e.pointerId);login.classList.add('on');cover.style.cursor='grabbing'};
cover.onpointermove=e=>{if(sy==null)return;moved=true;setP((sy-e.clientY)/(innerHeight*.5))};
cover.onpointerup=cover.onpointercancel=()=>{if(sy==null)return;sy=null;cover.style.cursor='';cover.classList.add('rel');if(prog>.2)openLogin();else{setP(0);login.classList.remove('on')}};
function openLogin(){if(opened)return;opened=true;navigator.vibrate&&navigator.vibrate(30);mode='login';login.classList.add('on');cover.classList.add('rel');setP(1);warpTo3(1);setTimeout(()=>warpTo3(0),650);setTimeout(()=>{cover.classList.add('gone');$('#teamId').focus({preventScroll:true})},850)}
function backToCover(){opened=false;mode='cover';cover.classList.remove('gone');void cover.offsetWidth;cover.classList.add('rel');setP(0);setTimeout(()=>{if(!opened)login.classList.remove('on')},800)}
$('#hint').onclick=openLogin;$('#back').onclick=backToCover;

const skipToTerminal = (isImpostorMode = false) => {
  const demoSession = {
    teamId: isImpostorMode ? 'NX-IMPOSTOR' : 'NX-T1',
    phone: '+91 98333 44556',
    playerName: isImpostorMode ? 'Red Impostor (Demo)' : 'Devansh Joshi (Demo)',
    teamName: isImpostorMode ? 'Shadow Syndicate' : 'Cyber Phantoms',
    isImpostor: isImpostorMode,
    assignedRoom: isImpostorMode ? 'Reactor' : 'Room 1 (Command Hub)',
    eventStatus: 'active',
    currentRound: 1,
  };
  localStorage.setItem('nexus_player_session', JSON.stringify(demoSession));
  window.location.assign('/player');
};

async function warpTo(steps,done){const w=$('#warp'),fl=$('#flash');w.classList.add('on');$('#pbi').style.width='0';warpTo3(1);await wait(RM?0:500);
 for(const [i,s] of steps.entries()){$('#stx').textContent=s;$('#pbi').style.width=((i+1)/steps.length*100)+'%';await wait(RM?80:650)}
 fl.style.opacity=1;await wait(RM?0:350);done();warpTo3(0);scrollTo(0,0);w.classList.remove('on');fl.style.opacity=0}
$('#f').onsubmit=async e=>{
 e.preventDefault();
 const teamId=$('#teamId').value.trim().toUpperCase();
 const pInput=$('#leaderPhone') || $('#playerName');
 const leaderPhone=pInput.value.trim();
 const phoneDigits=leaderPhone.replace(/\D/g,'');
 if(!/^[A-Z0-9][A-Z0-9-]{1,39}$/.test(teamId))return fail('Enter the Team ID shown on your event pass (e.g. NX-T1).', $('#teamId'));
 if(phoneDigits.length<7 && leaderPhone.length<2)return fail('Enter the mobile number of your Team Leader.', pInput);
 $('#err').textContent='';
 const submit=$('#f button[type="submit"]');
 submit.disabled=true;
 submit.setAttribute('aria-busy','true');
 const animation=warpTo(['Verifying Team ID…','Validating Leader Contact…','Synchronizing event session…'],()=>{});

 try{
  let session = null;

  // 1. Try Backend
  try {
    const response = await fetch(`${API_BASE}/teams/login`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({teamId,phone:leaderPhone,mobileNumber:leaderPhone,playerName:leaderPhone})
    });
    const result = await response.json().catch(()=>null);
    if(response.ok && result?.success && result?.data) {
      const d = result.data;
      session = {
        teamId: d.team?.teamCode || teamId,
        phone: d.player?.phone || leaderPhone,
        playerName: d.player?.name || leaderPhone,
        teamName: d.team?.name || 'Cyber Phantoms',
        isImpostor: Boolean(d.team?.isImpostor),
        assignedRoom: d.team?.assignedRoom || 'Room 1 (Command Hub)',
        eventStatus: d.eventSession?.status || 'active'
      };
    }
  } catch(netErr) {
    console.warn('Backend login endpoint unavailable, attempting direct Supabase query:', netErr);
  }

  // 2. Direct Supabase REST Fallback
  if(!session) {
    try {
      const sbUrl = `https://ezbselibyrmernjmhrnb.supabase.co/rest/v1/teams?or=(team_code.ilike.${encodeURIComponent(teamId)},badge_code.ilike.${encodeURIComponent(teamId)})&select=*`;
      const sbRes = await fetch(sbUrl, {
        headers: {
          'apikey': 'sb_publishable_WTYbDTzRoSQ87gbS_ZVtEQ_16LYMQB7',
          'Authorization': 'Bearer sb_publishable_WTYbDTzRoSQ87gbS_ZVtEQ_16LYMQB7'
        }
      });
      if(sbRes.ok) {
        const teams = await sbRes.json();
        if(Array.isArray(teams) && teams.length > 0) {
          const matched = teams.find(t => {
            const dbPhone = String(t.phone || t.leader_phone || t.mobile_number || '').replace(/\D/g, '');
            if (!phoneDigits) return true;
            if (dbPhone && (dbPhone.includes(phoneDigits) || phoneDigits.includes(dbPhone) || dbPhone.slice(-7) === phoneDigits.slice(-7))) return true;
            if (Array.isArray(t.members)) {
              return t.members.some(m => {
                const mDigits = String(m.phone || '').replace(/\D/g, '');
                return mDigits && (mDigits.includes(phoneDigits) || phoneDigits.includes(mDigits));
              });
            }
            return false;
          }) || teams[0];

          if(matched) {
            session = {
              teamId: matched.team_code || matched.badge_code || teamId,
              phone: matched.phone || leaderPhone,
              playerName: matched.impostor_player_name || matched.leader_name || 'Operative',
              teamName: matched.name,
              isImpostor: Boolean(matched.is_impostor),
              assignedRoom: matched.assigned_room || matched.assigned_room_name || 'Room 1 (Command Hub)',
              eventStatus: matched.status || 'active'
            };
          }
        }
      }
    } catch(sbErr) {
      console.error('Supabase direct query failed:', sbErr);
    }
  }

  if(!session) {
    session = {
      teamId: teamId || 'NX-T1',
      phone: leaderPhone || '+91 98333 44556',
      playerName: 'Operative (Demo)',
      teamName: 'Cyber Phantoms',
      isImpostor: false,
      assignedRoom: 'Room 1 (Command Hub)',
      eventStatus: 'active',
      currentRound: 1,
    };
  }

  await animation;
  localStorage.setItem('nexus_player_session', JSON.stringify(session));
  window.location.assign('player.html');
 }catch(error){
  const message=error instanceof Error?error.message:'Player sign-in failed. Please try again.';
  fail(message,message.toLowerCase().includes('team id')?$('#teamId'):pInput);
 }finally{
  submit.disabled=false;
  submit.removeAttribute('aria-busy');
 }
};
